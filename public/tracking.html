<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Theo dõi xe giao hàng</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#14171D;
    --surface:#1E222B;
    --line:#2A2F3A;
    --line-soft:#252A34;
    --text:#F1F3F6;
    --muted:#8B93A3;
    --muted2:#5C6373;
    --amber:#F5A623;
    --amber-dim:#3A2E14;
    --green:#34D399;
    --green-dim:#123028;
    --red:#FB6A5D;
    --red-dim:#3A1E1B;
    --blue:#5B9BFF;
    --blue-dim:#132038;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);}
  body{
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:0 0 40px 0;
  }
  .num{font-family:'Space Grotesk',sans-serif;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 14px 20px;
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand .name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; letter-spacing:.2px;}
  .brand .sub{font-size:12px; color:var(--muted);}
  .icon-btn{
    background:var(--surface); border:1px solid var(--line);
    width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); cursor:pointer; font-size:16px;
  }
  .icon-btn:active{background:var(--line);}

  .landing-hero{padding:8px 20px 28px 20px;}
  .landing-hero h1{
    font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:26px; line-height:1.25; margin:6px 0 8px 0;
  }
  .landing-hero p{color:var(--muted); font-size:14px; line-height:1.5; margin:0; max-width:38ch;}

  .role-list{padding:4px 20px; display:flex; flex-direction:column; gap:12px; flex:1;}
  .role-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:20px; text-align:left; cursor:pointer;
    display:flex; align-items:center; gap:16px;
  }
  .role-card:active{background:var(--line-soft);}
  .role-card .dot{
    width:44px; height:44px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
  }
  .role-card.driver .dot{background:var(--amber-dim); color:var(--amber);}
  .role-card.manager .dot{background:var(--green-dim); color:var(--green);}
  .role-card.lookup .dot{background:var(--blue-dim); color:var(--blue);}
  .role-card .txt strong{display:block; font-size:16px; margin-bottom:2px;}
  .role-card .txt span{font-size:13px; color:var(--muted);}

  .screen{padding:0 20px; flex:1; display:flex; flex-direction:column;}
  .back-row{padding:14px 20px 0 20px; display:flex; align-items:center; gap:10px;}
  .back-btn{
    background:none; border:none; color:var(--muted); font-size:14px;
    display:flex; align-items:center; gap:6px; cursor:pointer; padding:6px 0;
  }

  label.field-label{font-size:13px; color:var(--muted); margin:18px 0 8px 0; display:block;}
  input[type="text"], input[type="number"], input[type="tel"]{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
    padding:14px 16px; border-radius:12px; font-size:16px; font-family:'Inter',sans-serif;
  }
  input::placeholder{color:var(--muted2);}

  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:14px; padding:16px 20px; font-size:15px; font-weight:600;
    cursor:pointer; width:100%; font-family:'Inter',sans-serif;
  }
  .btn-primary{background:var(--amber); color:#1A1400;}
  .btn-primary:active{opacity:.85;}
  .btn-stop{background:var(--red); color:#2A0A06;}
  .btn-blue{background:var(--blue); color:#081226;}
  .btn-outline{background:transparent; border:1px solid var(--line); color:var(--text);}
  .btn-outline:active{background:var(--surface);}
  .btn[disabled]{opacity:.5;}

  .status-hero{
    margin-top:26px; padding:28px 20px; border-radius:20px;
    background:var(--surface); border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px;
  }
  .pulse-wrap{width:64px; height:64px; position:relative; display:flex; align-items:center; justify-content:center; margin-bottom:6px;}
  .pulse-dot{width:16px; height:16px; border-radius:50%; background:var(--amber); z-index:2;}
  .pulse-ring{
    position:absolute; width:64px; height:64px; border-radius:50%;
    background:var(--amber); opacity:.35;
    animation:pulse 2.2s ease-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .pulse-ring{animation:none; opacity:.15;} }
  @keyframes pulse{
    0%{transform:scale(.3); opacity:.45;}
    100%{transform:scale(1); opacity:0;}
  }
  .status-hero.idle .pulse-dot{background:var(--muted2);}
  .status-hero.idle .pulse-ring{display:none;}
  .status-hero.delivering .pulse-dot{background:var(--blue);}
  .status-hero.delivering .pulse-ring{background:var(--blue);}
  .status-hero .headline{font-size:16px; font-weight:600;}
  .status-hero .detail{font-size:13px; color:var(--muted); line-height:1.5;}

  .field-block{margin-top:22px;}
  .btn-row{margin-top:22px; display:flex; flex-direction:column; gap:10px;}

  .mgr-header{padding:16px 20px 4px 20px;}
  .mgr-header p{font-size:13px; color:var(--muted); margin:0;}

  .vehicle-list{padding:16px 20px 0 20px; display:flex; flex-direction:column; gap:10px;}
  .vehicle-row{
    display:flex; align-items:stretch; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; overflow:hidden; cursor:pointer;
  }
  .vehicle-row:active{background:var(--line-soft);}
  .vehicle-row .bar{width:5px; flex-shrink:0;}
  .vehicle-row.ok .bar{background:var(--amber);}
  .vehicle-row.close .bar{background:var(--green);}
  .vehicle-row.stale .bar{background:var(--red);}
  .vehicle-row .body{flex:1; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .vehicle-row .who{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .vehicle-row .who .nm{font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .vehicle-row .who .upd{font-size:12px; color:var(--muted);}
  .vehicle-row.close .who .upd{color:var(--green);}
  .vehicle-row.stale .who .upd{color:var(--red);}
  .vehicle-row .metrics{text-align:right; flex-shrink:0;}
  .vehicle-row .metrics .d{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;}
  .vehicle-row .metrics .t{font-size:12px; color:var(--muted);}

  .empty-state{
    margin:20px 20px 0 20px; padding:32px 20px; text-align:center;
    border:1px dashed var(--line); border-radius:16px; color:var(--muted); font-size:13px; line-height:1.6;
  }

  .settings-note{font-size:12px; color:var(--muted2); margin-top:10px; line-height:1.6;}

  .photo-input-wrap{
    margin-top:14px; border:1px dashed var(--line); border-radius:14px; padding:22px;
    text-align:center; color:var(--muted); font-size:13px; cursor:pointer;
  }
  .photo-preview{width:100%; border-radius:14px; margin-top:14px; display:block;}

  .result-card{
    margin-top:22px; background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden;
  }
  .result-card img{width:100%; display:block; max-height:220px; object-fit:cover;}
  .result-card .rc-body{padding:16px;}
  .result-card .rc-title{font-size:15px; font-weight:600; margin-bottom:4px;}
  .result-card .rc-sub{font-size:13px; color:var(--muted); margin-bottom:14px;}

  ::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  const API = "";

  async function apiGet(path){
    try{ const r = await fetch(API + path); if(!r.ok) return {ok:false, status:r.status}; const j = await r.json(); return {ok:true, data:j}; }catch(e){ return {ok:false, status:0}; }
  }
  async function apiPost(path, body){
    try{
      const r = await fetch(API + path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
      const j = await r.json().catch(()=>null);
      return {ok:r.ok, data:j};
    }catch(e){ return {ok:false, data:null}; }
  }
  async function apiDelete(path){
    try{ await fetch(API + path, {method:'DELETE'}); }catch(e){}
  }

  function getLocal(key){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
  function setLocal(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

  function slugify(s){
    return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/đ/g,'d').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'tai-xe';
  }
  function normPhone(s){ return String(s||'').replace(/[^0-9]/g,''); }
  function haversineKm(lat1, lon1, lat2, lon2){
    const R = 6371;
    const dLat = (lat2-lat1) * Math.PI/180;
    const dLon = (lon2-lon1) * Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }
  function timeAgo(ts){
    const s = Math.floor((Date.now()-ts)/1000);
    if(s < 60) return 'vừa xong';
    const m = Math.floor(s/60);
    if(m < 60) return m + ' phút trước';
    const h = Math.floor(m/60);
    return h + ' giờ trước';
  }
  function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function fileToBase64(file){
    return new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(',')[1]);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  let view = 'loading';
  let shareTimer = null;
  let refreshTimer = null;
  let driverName = '';
  let storeConfig = null;
  let delivering = false;
  let lastKnownPos = null;

  const app = document.getElementById('app');
  function render(html){ app.innerHTML = html; }

  function screenLanding(){
    stopTimers();
    view = 'landing';
    render(`
      <div class="topbar">
        <div class="brand"><div class="name">Theo dõi xe giao hàng</div><div class="sub">5152 · Kế Sách</div></div>
      </div>
      <div class="landing-hero">
        <h1>Xe đang ở đâu, còn bao lâu về tới?</h1>
        <p>Tài xế bật chia sẻ vị trí và ghi lại điểm giao hàng, quản lý xem danh sách xe, ai cũng tra được vị trí nhà khách qua số điện thoại.</p>
      </div>
      <div class="role-list">
        <div class="role-card driver" id="go-driver">
          <div class="dot">🛵</div>
          <div class="txt"><strong>Tôi là Tài xế</strong><span>Chia sẻ vị trí và giao hàng</span></div>
        </div>
        <div class="role-card manager" id="go-manager">
          <div class="dot">📍</div>
          <div class="txt"><strong>Tôi là Quản lý</strong><span>Xem danh sách xe đang giao</span></div>
        </div>
        <div class="role-card lookup" id="go-lookup">
          <div class="dot">🔍</div>
          <div class="txt"><strong>Tra cứu khách hàng</strong><span>Tìm vị trí nhà khách theo SĐT</span></div>
        </div>
      </div>
    `);
    document.getElementById('go-driver').onclick = () => screenDriverSetup();
    document.getElementById('go-manager').onclick = () => screenManagerInit();
    document.getElementById('go-lookup').onclick = () => screenLookup();
  }

  async function screenDriverSetup(){
    view = 'driver-setup';
    const saved = getLocal('driver-name');
    render(`
      <div class="back-row"><button class="back-btn" id="back">← Quay lại</button></div>
      <div class="screen">
        <div class="landing-hero" style="padding-left:0;padding-right:0;">
          <h1>Chia sẻ vị trí xe</h1>
          <p>Nhập tên hoặc biển số xe để quản lý nhận ra xe của anh/chị trong danh sách.</p>
        </div>
        <label class="field-label" for="dname">Tên tài xế / biển số xe</label>
        <input type="text" id="dname" placeholder="VD: Anh Tâm - 65B1-123.45" value="${esc(saved||'')}">
        <div class="btn-row">
          <button class="btn btn-primary" id="start">Bắt đầu chia sẻ vị trí</button>
        </div>
      </div>
    `);
    document.getElementById('back').onclick = screenLanding;
    document.getElementById('start').onclick = () => {
      const val = document.getElementById('dname').value.trim();
      if(!val){ document.getElementById('dname').focus(); return; }
      driverName = val;
      setLocal('driver-name', val);
      delivering = false;
      screenDriverActive();
    };
  }

  function screenDriverActive(){
    view = 'driver-active';
    render(`
      <div class="back-row"><button class="back-btn" id="back">← Quay lại</button></div>
      <div class="screen">
        <div class="status-hero idle" id="hero">
          <div class="pulse-wrap"><div class="pulse-ring"></div><div class="pulse-dot"></div></div>
          <div class="headline" id="headline">Đang xin quyền vị trí…</div>
          <div class="detail" id="detail">${esc(driverName)}</div>
        </div>
        <div class="btn-row">
          <button class="btn btn-blue" id="godeliver">Bắt đầu giao hàng</button>
          <button class="btn btn-stop" id="stop">Dừng chia sẻ</button>
        </div>
        <p class="settings-note">Giữ trang này mở trên điện thoại trong lúc giao hàng. Vị trí được cập nhật khoảng mỗi 12 giây.</p>
      </div>
    `);
    document.getElementById('back').onclick = () => { stopSharing(); screenLanding(); };
    document.getElementById('stop').onclick = () => { stopSharing(); screenDriverSetup(); };
    document.getElementById('godeliver').onclick = () => { delivering = true; screenDriverActive2(); };
    startSharing();
  }

  function screenDriverActive2(){
    view = 'driver-delivering';
    render(`
      <div class="back-row"><button class="back-btn" id="back">← Quay lại</button></div>
      <div class="screen">
        <div class="status-hero delivering" id="hero">
          <div class="pulse-wrap"><div class="pulse-ring"></div><div class="pulse-dot"></div></div>
          <div class="headline" id="headline">Đang giao hàng</div>
          <div class="detail" id="detail">${esc(driverName)}</div>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="arrive">Đã đến nơi — Hoàn tất</button>
          <button class="btn btn-outline" id="cancel">Hủy chuyến giao này</button>
        </div>
        <p class="settings-note">Khi tới nhà khách, bấm "Đã đến nơi" để lưu vị trí và ảnh nhà khách cho lần giao sau.</p>
      </div>
    `);
    document.getElementById('back').onclick = () => { stopSharing(); screenLanding(); };
    document.getElementById('cancel').onclick = () => { delivering = false; screenDriverActive(); };
    document.getElementById('arrive').onclick = () => screenArrive();
  }

  function startSharing(){
    if(!('geolocation' in navigator)){
      setHero(false, 'Thiết bị không hỗ trợ định vị', 'Hãy dùng trình duyệt khác hoặc bật vị trí trong Cài đặt.');
      return;
    }
    tickShare();
    shareTimer = setInterval(tickShare, 12000);
  }

  function tickShare(){
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const {latitude, longitude} = pos.coords;
      lastKnownPos = {lat: latitude, lng: longitude};
      await apiPost('/api/tracking/driver', {name: driverName, lat: latitude, lng: longitude});
      let distTxt = '';
      if(!storeConfig){ const r = await apiGet('/api/tracking/store'); if(r.ok) storeConfig = r.data; }
      if(storeConfig && storeConfig.lat){
        const d = haversineKm(latitude, longitude, storeConfig.lat, storeConfig.lng);
        distTxt = d < 0.3 ? 'Đã tới siêu thị' : d.toFixed(1) + ' km về siêu thị';
      }
      if(!delivering) setHero(true, 'Đang chia sẻ vị trí', distTxt || esc(driverName));
    }, (err) => {
      let msg = 'Không lấy được vị trí. Kiểm tra lại quyền truy cập vị trí.';
      if(err.code === 1) msg = 'Anh/chị chưa cho phép truy cập vị trí. Vào Cài đặt trình duyệt để bật.';
      if(!delivering) setHero(false, 'Chưa chia sẻ được vị trí', msg);
    }, {enableHighAccuracy:true, timeout:10000, maximumAge:5000});
  }

  function setHero(active, headline, detail){
    const hero = document.getElementById('hero');
    if(!hero) return;
    hero.classList.toggle('idle', !active);
    const h = document.getElementById('headline'); if(h) h.textContent = headline;
    const d = document.getElementById('detail'); if(d) d.textContent = detail;
  }

  function stopSharing(){
    if(shareTimer){ clearInterval(shareTimer); shareTimer = null; }
    if(driverName){ apiDelete('/api/tracking/driver/' + slugify(driverName)); }
  }

  // ---------- ARRIVE: nhap SDT khach, kiem tra trung, chup anh neu can ----------
  function screenArrive(){
    view = 'arrive';
    render(`
      <div class="back-row"><button class="back-btn" id="back">← Quay lại</button></div>
      <div class="screen">
        <div class="landing-hero" style="padding-left:0;padding-right:0;">
          <h1>Xác nhận giao hàng</h1>
          <p>Nhập số điện thoại khách để lưu vị trí nhà cho lần giao sau.</p>
        </div>
        <label class="field-label" for="phone">Số điện thoại khách</label>
        <input type="tel" id="phone" placeholder="VD: 0909 123 456">
        <div class="btn-row">
          <button class="btn btn-primary" id="check">Kiểm tra & Hoàn tất</button>
        </div>
        <p class="settings-note" id="status"></p>
      </div>
    `);
    document.getElementById('back').onclick = screenDriverActive2;
    document.getElementById('check').onclick = async () => {
      const phone = normPhone(document.getElementById('phone').value);
      const statusEl = document.getElementById('status');
      if(!phone || phone.length < 8){ statusEl.textContent = 'Số điện thoại chưa hợp lệ.'; return; }
      statusEl.textContent = 'Đang kiểm tra…';
      const r = await apiGet('/api/tracking/customer/' + phone);
      if(r.ok){
        statusEl.textContent = 'Khách đã có sẵn trong hệ thống, không cần lưu lại.';
        setTimeout(finishDelivery, 900);
      } else {
        screenCapturePhoto(phone);
      }
    };
  }

  function screenCapturePhoto(phone){
    view = 'capture';
    render(`
      <div class="back-row"><button class="back-btn" id="back">← Quay lại</button></div>
      <div class="screen">
        <div class="landing-hero" style="padding-left:0;padding-right:0;">
          <h1>Chụp ảnh nhà khách</h1>
          <p>Khách chưa có trong hệ thống. Chụp ảnh mặt tiền nhà để lần sau tài xế khác dễ nhận ra.</p>
        </div>
        <label class="photo-input-wrap" id="picklabel">
          📷 Bấm để mở camera
          <input type="file" accept="image/*" capture="environment" id="photofile" style="display:none;">
        </label>
        <img id="preview" class="photo-preview" style="display:none;">
        <div class="btn-row">
          <button class="btn btn-primary" id="save" disabled>Lưu và hoàn tất</button>
        </div>
        <p class="settings-note" id="status"></p>
      </div>
    `);
    document.getElementById('back').onclick = () => screenArrive();
    const fileInput = document.getElementById('photofile');
    const preview = document.getElementById('preview');
    const saveBtn = document.getElementById('save');
    let chosenFile = null;
    document.getElementById('picklabel').onclick = (e) => {};
    fileInput.onchange = () => {
      if(fileInput.files && fileInput.files[0]){
        chosenFile = fileInput.files[0];
        preview.src = URL.createObjectURL(chosenFile);
        preview.style.display = 'block';
        saveBtn.disabled = false;
      }
    };
    saveBtn.onclick = async () => {
      if(!chosenFile) return;
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Đang lưu…';
      saveBtn.disabled = true;
      const b64 = await fileToBase64(chosenFile);
      const pos = lastKnownPos || {lat:0, lng:0};
      const r = await apiPost('/api/tracking/customer', {
        phone, lat: pos.lat, lng: pos.lng, photoBase64: b64, savedBy: driverName
      });
      if(r.ok){
        statusEl.textContent = 'Đã lưu thành công.';
        setTimeout(finishDelivery, 700);
      } else {
        statusEl.textContent = 'Lưu thất bại, thử lại.';
        saveBtn.disabled = false;
      }
    };
  }

  function finishDelivery(){
    delivering = false;
    screenDriverActive();
  }

  // ---------- MANAGER ----------
  async function screenManagerInit(){
    const r = await apiGet('/api/tracking/store');
    storeConfig = r.ok ? r.data : null;
    if(storeConfig && storeConfig.lat){
      screenManagerList();
    } else {
      screenStoreSetup();
    }
  }

  function screenStoreSetup(){
    view = 'store-setup';
    render(`
      <div class="back-row"><button class="back-btn" id="back">← Quay lại</button></div>
      <div class="screen">
        <div class="landing-hero" style="padding-left:0;padding-right:0;">
          <h1>Đặt vị trí siêu thị</h1>
          <p>Đứng tại siêu thị và bấm nút bên dưới một lần duy nhất — đây sẽ là điểm đích để tính khoảng cách và thời gian về của các xe.</p>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="setloc">Dùng vị trí hiện tại của tôi</button>
        </div>
        <p class="settings-note" id="status"></p>
      </div>
    `);
    document.getElementById('back').onclick = screenLanding;
    document.getElementById('setloc').onclick = () => {
      document.getElementById('status').textContent = 'Đang xác định vị trí…';
      navigator.geolocation.getCurrentPosition(async (pos) => {
        storeConfig = {lat: pos.coords.latitude, lng: pos.coords.longitude, speedKmh: 30};
        await apiPost('/api/tracking/store', storeConfig);
        screenManagerList();
      }, () => {
        document.getElementById('status').textContent = 'Không lấy được vị trí. Kiểm tra quyền truy cập vị trí rồi thử lại.';
      }, {enableHighAccuracy:true, timeout:10000});
    };
  }

  async function screenManagerList(){
    view = 'manager-list';
    render(`
      <div class="topbar">
        <div class="brand"><div class="name">Danh sách xe</div><div class="sub">5152 · Kế Sách</div></div>
        <button class="icon-btn" id="settings">⚙</button>
      </div>
      <div id="listwrap"></div>
      <div style="padding:20px 20px 0 20px;">
        <button class="btn btn-outline" id="backhome">← Về màn hình chính</button>
      </div>
    `);
    document.getElementById('settings').onclick = screenManagerSettings;
    document.getElementById('backhome').onclick = () => { stopTimers(); screenLanding(); };
    await refreshList();
    refreshTimer = setInterval(refreshList, 8000);
  }

  async function refreshList(){
    const wrap = document.getElementById('listwrap');
    if(!wrap) return;
    const r = await apiGet('/api/tracking/drivers');
    const drivers = r.ok ? r.data : [];
    if(!drivers.length){
      wrap.innerHTML = `<div class="empty-state">Chưa có xe nào chia sẻ vị trí.<br>Nhờ tài xế mở trang này, chọn "Tôi là Tài xế" và bấm bắt đầu chia sẻ.</div>`;
      return;
    }
    const speed = (storeConfig && storeConfig.speedKmh) || 30;
    drivers.forEach(d => { d.dist = haversineKm(d.lat, d.lng, storeConfig.lat, storeConfig.lng); });
    drivers.sort((a,b) => a.dist - b.dist);

    const rows = drivers.map(d => {
      const stale = (Date.now() - d.updatedAt) > 3*60*1000;
      const close = !stale && d.dist < 0.3;
      const cls = stale ? 'stale' : (close ? 'close' : 'ok');
      const etaMin = Math.max(1, Math.round(d.dist / speed * 60));
      const distTxt = close ? 'Đã tới' : d.dist.toFixed(1) + ' km';
      const timeTxt = close ? '' : '~' + etaMin + ' phút';
      const updTxt = stale ? 'Mất tín hiệu · ' + timeAgo(d.updatedAt) : timeAgo(d.updatedAt);
      const mapsUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + d.lat + ',' + d.lng;
      return `
        <div class="vehicle-row ${cls}" data-url="${mapsUrl}">
          <div class="bar"></div>
          <div class="body">
            <div class="who"><div class="nm">${esc(d.name)}</div><div class="upd">${updTxt}</div></div>
            <div class="metrics"><div class="d num">${distTxt}</div><div class="t">${timeTxt}</div></div>
          </div>
        </div>`;
    }).join('');

    wrap.innerHTML = `
      <div class="mgr-header"><p>${drivers.length} xe đang chia sẻ vị trí · cập nhật tự động</p></div>
      <div class="vehicle-list">${rows}</div>
    `;
    wrap.querySelectorAll('.vehicle-row').forEach(el => {
      el.onclick = () => window.open(el.dataset.url, '_blank');
    });
  }

  function screenManagerSettings(){
    stopTimers();
    view = 'manager-settings';
    render(`
      <div class="back-row"><button class="back-btn" id="back">← Quay lại</button></div>
      <div class="screen">
        <div class="landing-hero" style="padding-left:0;padding-right:0;">
          <h1>Cài đặt</h1>
          <p>Tốc độ trung bình dùng để ước tính thời gian xe về tới siêu thị.</p>
        </div>
        <label class="field-label" for="speed">Tốc độ trung bình (km/h)</label>
        <input type="number" id="speed" value="${(storeConfig && storeConfig.speedKmh) || 30}" min="5" max="80">
        <div class="btn-row">
          <button class="btn btn-primary" id="save">Lưu</button>
          <button class="btn btn-outline" id="reloc">Đặt lại vị trí siêu thị</button>
        </div>
      </div>
    `);
    document.getElementById('back').onclick = screenManagerList;
    document.getElementById('save').onclick = async () => {
      const v = parseFloat(document.getElementById('speed').value) || 30;
      storeConfig = {...storeConfig, speedKmh: v};
      await apiPost('/api/tracking/store', storeConfig);
      screenManagerList();
    };
    document.getElementById('reloc').onclick = screenStoreSetup;
  }

  // ---------- LOOKUP ----------
  async function screenLookup(){
    view = 'lookup';
    if(!storeConfig){ const r = await apiGet('/api/tracking/store'); if(r.ok) storeConfig = r.data; }
    render(`
      <div class="back-row"><button class="back-btn" id="back">← Quay lại</button></div>
      <div class="screen">
        <div class="landing-hero" style="padding-left:0;padding-right:0;">
          <h1>Tra cứu khách hàng</h1>
          <p>Nhập số điện thoại khách để xem vị trí nhà và chỉ đường từ siêu thị.</p>
        </div>
        <label class="field-label" for="phone">Số điện thoại khách</label>
        <input type="tel" id="phone" placeholder="VD: 0909 123 456">
        <div class="btn-row">
          <button class="btn btn-primary" id="search">Tìm khách hàng</button>
        </div>
        <div id="result"></div>
      </div>
    `);
    document.getElementById('back').onclick = screenLanding;
    document.getElementById('search').onclick = async () => {
      const phone = normPhone(document.getElementById('phone').value);
      const resultEl = document.getElementById('result');
      if(!phone || phone.length < 8){ resultEl.innerHTML = '<p class="settings-note">Số điện thoại chưa hợp lệ.</p>'; return; }
      resultEl.innerHTML = '<p class="settings-note">Đang tìm…</p>';
      const r = await apiGet('/api/tracking/customer/' + phone);
      if(!r.ok){
        resultEl.innerHTML = '<p class="settings-note">Chưa có dữ liệu khách này. Tài xế giao lần đầu sẽ tự lưu lại.</p>';
        return;
      }
      const c = r.data;
      let distTxt = '';
      if(storeConfig && storeConfig.lat){
        const d = haversineKm(storeConfig.lat, storeConfig.lng, c.lat, c.lng);
        distTxt = d.toFixed(1) + ' km từ siêu thị';
      }
      const mapsUrl = storeConfig && storeConfig.lat
        ? 'https://www.google.com/maps/dir/?api=1&origin=' + storeConfig.lat + ',' + storeConfig.lng + '&destination=' + c.lat + ',' + c.lng
        : 'https://www.google.com/maps/dir/?api=1&destination=' + c.lat + ',' + c.lng;
      resultEl.innerHTML = `
        <div class="result-card">
          ${c.photoUrl ? `<img src="${esc(c.photoUrl)}">` : ''}
          <div class="rc-body">
            <div class="rc-title">Khách ${esc(c.phone)}</div>
            <div class="rc-sub">${distTxt}${c.savedBy ? ' · Lưu bởi ' + esc(c.savedBy) : ''}</div>
            <button class="btn btn-blue" id="directions">Chỉ đường từ siêu thị</button>
          </div>
        </div>
      `;
      document.getElementById('directions').onclick = () => window.open(mapsUrl, '_blank');
    };
  }

  function stopTimers(){
    if(refreshTimer){ clearInterval(refreshTimer); refreshTimer = null; }
  }

  screenLanding();
})();
</script>
</body>
</html>
