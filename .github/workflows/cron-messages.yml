name: LINE Scheduled Messages
on: {schedule: [{cron: '10 20 * * *'}, {cron: '0 22 * * *'}, {cron: '30 0 * * *'}, {cron: '30 2 * * *'}, {cron: '0 4 * * *'}, {cron: '30 4 * * *'}, {cron: '30 6 * * *'}, {cron: '0 11 * * *'}, {cron: '30 12 * * *'}, {cron: '0 23 * * *'}, {cron: '0 12 * * *'}], workflow_dispatch: {inputs: {id: {description: 'Message id to send (1-9 or cleaning)', required: false}}}}
jobs: {send: {runs-on: ubuntu-latest, steps: [{name: 'Determine message id', id: pick, run: 'case "${{ github.event.schedule }}" in "10 20 * * *") echo "id=1" >> $GITHUB_OUTPUT ;; "0 22 * * *") echo "id=2" >> $GITHUB_OUTPUT ;; "30 0 * * *") echo "id=3" >> $GITHUB_OUTPUT ;; "30 2 * * *") echo "id=4" >> $GITHUB_OUTPUT ;; "0 4 * * *") echo "id=5" >> $GITHUB_OUTPUT ;; "30 4 * * *") echo "id=6" >> $GITHUB_OUTPUT ;; "30 6 * * *") echo "id=7" >> $GITHUB_OUTPUT ;; "0 11 * * *") echo "id=8" >> $GITHUB_OUTPUT ;; "30 12 * * *") echo "id=9" >> $GITHUB_OUTPUT ;; "0 23 * * *") echo "id=cleaning" >> $GITHUB_OUTPUT ;; "0 12 * * *") echo "id=cleaning" >> $GITHUB_OUTPUT ;; *) echo "id=${{ github.event.inputs.id }}" >> $GITHUB_OUTPUT ;; esac'}, {name: 'Call endpoint', run: 'curl -s "https://line-bot-bao-cao.onrender.com/cron/${{ steps.pick.outputs.id }}?key=kesach2026secret"'}]}}
