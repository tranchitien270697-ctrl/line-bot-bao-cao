name: LINE Scheduled Messages
on: {schedule: [{cron: '40 22 * * *'}, {cron: '30 0 * * *'}, {cron: '0 3 * * *'}, {cron: '0 5 * * *'}, {cron: '30 6 * * *'}, {cron: '0 7 * * *'}, {cron: '0 9 * * *'}, {cron: '30 13 * * *'}, {cron: '0 15 * * *'}, {cron: '0 23 * * *'}, {cron: '0 12 * * *'}], workflow_dispatch: {inputs: {id: {description: 'Message id to send (1-9 or cleaning)', required: false}}}}
jobs: {send: {runs-on: ubuntu-latest, steps: [{name: 'Determine message id', id: pick, run: 'case "${{ github.event.schedule }}" in "40 22 * * *") echo "id=1" >> $GITHUB_OUTPUT ;; "30 0 * * *") echo "id=2" >> $GITHUB_OUTPUT ;; "0 3 * * *") echo "id=3" >> $GITHUB_OUTPUT ;; "0 5 * * *") echo "id=4" >> $GITHUB_OUTPUT ;; "30 6 * * *") echo "id=5" >> $GITHUB_OUTPUT ;; "0 7 * * *") echo "id=6" >> $GITHUB_OUTPUT ;; "0 9 * * *") echo "id=7" >> $GITHUB_OUTPUT ;; "30 13 * * *") echo "id=8" >> $GITHUB_OUTPUT ;; "0 15 * * *") echo "id=9" >> $GITHUB_OUTPUT ;; "0 23 * * *") echo "id=cleaning" >> $GITHUB_OUTPUT ;; "0 12 * * *") echo "id=cleaning" >> $GITHUB_OUTPUT ;; *) echo "id=${{ github.event.inputs.id }}" >> $GITHUB_OUTPUT ;; esac'}, {name: 'Call endpoint', run: 'curl -s "https://line-bot-bao-cao.onrender.com/cron/${{ steps.pick.outputs.id }}?key=kesach2026secret"'}]}}
