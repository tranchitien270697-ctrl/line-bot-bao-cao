name: LINE Scheduled Messages
on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '0 23 * * *'
    - cron: '50 3 * * *'
    - cron: '10 7 * * *'
    - cron: '30 12 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      id:
        description: 'Message id to send (morning, morning2, midday, 6, 8, 9)'
        required: false
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Determine message ids
        id: pick
        run: |
          IDS=""
          case "${{ github.event.schedule }}" in
            "30 0 * * *") IDS="morning" ;;
            "0 23 * * *") IDS="morning2" ;;
            "50 3 * * *") IDS="midday" ;;
            "10 7 * * *") IDS="6" ;;
            "30 12 * * *") IDS="8" ;;
            "0 15 * * *") IDS="9" ;;
            *) IDS="${{ github.event.inputs.id }}" ;;
          esac
          echo "ids=$IDS" >> $GITHUB_OUTPUT
      - name: Call endpoints
        run: |
          for id in ${{ steps.pick.outputs.ids }}; do
            curl -s "https://line-bot-bao-cao.onrender.com/cron/$id?key=kesach2026secret"
          done
